<title>OwnApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OwnApp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine Spalte wie eine iPhone-App. Unten fünf Module, oben im Modul eine Leiste für Unterbereiche.
   Jedes Modul hat seine eigene Akzentfarbe, alles andere ist gemeinsam. */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --raise:#eeeeea; --ink:#1b1d1a; --muted:#6b6e66; --line:#e2e2dc;
  --accent:#2f5d8a; --accent-2:#5b8fc4; --accent-soft:#e1ebf5; --accent-ink:#ffffff;
  --good:#157a46; --good-soft:#dcf0e3; --bad:#d1352b; --bad-soft:#fbe3e0; --warn:#b26a00;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
body[data-mod="home"]{--accent:#2a2d27;--accent-2:#5a5f55;--accent-soft:#ebebe5}
body[data-mod="budget"]{--accent:#1f7a52;--accent-2:#3fa775;--accent-soft:#dcefe3}
body[data-mod="film"]{--accent:#c2185b;--accent-2:#e2577f;--accent-soft:#fbe4ec}
body[data-mod="training"]{--accent:#e0560b;--accent-2:#f59e0b;--accent-soft:#fde7d6}
body[data-mod="ziele"]{--accent:#2f5d8a;--accent-2:#4f8cc9;--accent-soft:#e1ebf5}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:19px;font-weight:700} h3{font-size:15.5px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.hero .note{color:rgba(255,255,255,.85)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.9;font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:1}
.hero .big small{font-size:18px;margin-right:6px}
.hero .btn{background:#fff;color:var(--accent)}
.hero .btn.dark{background:var(--ink);color:#fff}
.hero .btn.clear{background:rgba(255,255,255,.22);color:#fff}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.hero .pill{background:rgba(255,255,255,.24);color:#fff;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.btn{font:700 15px var(--f-body);border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline>label{flex:1 1 120px}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 13.5px var(--f-body);padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:600 13.5px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);grid-column:1/-1;overflow-wrap:anywhere}
.item .v{text-align:right}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .bar{background:rgba(255,255,255,.28)} .hero .bar i{background:#fff}
.bar.over i{background:var(--bad)} .bar.near i{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 21px var(--f-num)} .stat span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:20px;height:20px}
.tile b{font-weight:600;font-size:15px} .tile span{font-size:12.5px;color:var(--muted)}
.tile em{font-style:normal;font:700 13px var(--f-num);color:var(--accent)}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:600 14px var(--f-body);cursor:pointer;align-self:flex-start}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
.empty{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:16px}
.alert{background:var(--bad-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.ok{background:var(--good-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.w{color:var(--good)} .l{color:var(--bad)}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around;z-index:5}
.nav button{border:0;background:none;color:var(--muted);font:600 11px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;cursor:pointer;min-width:56px}
.nav svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(27,29,26,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box;max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;max-width:88%;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* Start */
.hello{display:flex;flex-direction:column;gap:2px}
.hello .date{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.modcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.modcard .ico{width:44px;height:44px;border-radius:13px}
.modcard b{display:block;font:700 16px var(--f-display)}
.modcard span{font-size:13.5px;color:var(--muted)}
.modcard .big{font:700 16px var(--f-num);text-align:right}
.modcard[data-c="budget"] .ico{background:#dcefe3;color:#1f7a52}
.modcard[data-c="film"] .ico{background:#fbe4ec;color:#c2185b}
.modcard[data-c="training"] .ico{background:#fde7d6;color:#e0560b}
.modcard[data-c="ziele"] .ico{background:#e1ebf5;color:#2f5d8a}
/* Budget */
.amount{font:800 40px var(--f-display);text-align:center;border:0;background:none;padding:6px}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.proj div{background:var(--bg);border-radius:12px;padding:10px 4px}
.proj b{display:block;font-family:var(--f-num);font-weight:500;font-size:15px}
.proj span{font-size:12px;color:var(--muted)}
.cat .bar{grid-column:1/-1}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;color:var(--ink);font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
.month span{font-weight:600;font-size:14px;min-width:92px;text-align:center}
/* Film */
.films{display:flex;flex-direction:column;gap:12px}
.film{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.poster{aspect-ratio:2/3;max-width:100%;border-radius:10px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box;font:800 11px/1.15 var(--f-display);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);overflow:hidden;word-break:break-word}
.film .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.meta{font-size:12.5px;color:var(--muted)}
.prov{display:flex;flex-wrap:wrap;gap:5px}
.prov span{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--raise)}
.prov span.flat{background:var(--good-soft);color:var(--good)}
.prov span.rent{color:var(--muted)}
.prov span.maybe{border:1px dashed currentColor;background:none}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;color:var(--line);font-size:21px;padding:0 1px;cursor:pointer;line-height:1}
.stars button.on{color:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .dow{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;border:0;background:none;color:var(--ink);font:600 14px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.today{outline:1px solid var(--accent)} .day.sel{background:var(--accent-soft)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.next{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.next .when{font:800 20px var(--f-display);color:var(--accent)}
.copy{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;user-select:text}
/* Training */
.timer{font:700 52px/1 var(--f-num);letter-spacing:-.02em}
.drill{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.drill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.box{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);margin-top:2px;flex:none}
.drill[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.drill b{display:block;font-weight:600} .drill span{font-size:12.5px;color:var(--muted)}
.lib{display:flex;flex-direction:column;gap:8px}
.libitem{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.lvl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg3{display:flex;gap:4px}
.seg3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;font:600 12.5px var(--f-body);color:var(--muted);cursor:pointer}
.seg3 button[aria-pressed="true"].s0{background:var(--raise);color:var(--ink)}
.seg3 button[aria-pressed="true"].s1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.seg3 button[aria-pressed="true"].s2{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
.rung .k{font-weight:600}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.track i{height:10px;border-radius:3px;background:var(--raise)}
.track i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.track i.goal{outline:2px solid var(--good);outline-offset:1px}
.tier{font:700 13px var(--f-num);min-width:80px;text-align:right}
.tier small{color:var(--muted);font-weight:500}
.wl{font-family:var(--f-num);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(0deg,var(--accent),var(--accent-2));min-height:2px}
.bars span{font-size:11px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar .b{height:10px;border-radius:5px;background:var(--raise);overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .b i.win{background:var(--good)} .hbar .b i.loss{background:var(--bad)}
.plan{display:flex;flex-direction:column;gap:6px}
.pday{display:grid;grid-template-columns:30px 84px 1fr 66px;gap:6px;align-items:center}
.pday.today{background:var(--accent-soft);border-radius:10px;padding:4px}
.pday input,.pday select{padding:8px 6px;font-size:14px}
.react{height:230px;border-radius:18px;border:0;width:100%;font:700 22px var(--f-body);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.react.wait{background:#b91c1c} .react.go{background:var(--good)} .react.idle{background:var(--ink)} .react.done{background:var(--accent)}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;font:700 13px var(--f-num)}
.step.now .n{background:var(--accent);color:#fff} .step.done{opacity:.5}
.meter{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--good),#f59e0b,var(--bad));position:relative}
.meter i{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.slots{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.slots input{padding:6px 2px;text-align:center;font-size:11px;aspect-ratio:1;border-radius:8px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;font:inherit;color:var(--ink)}
.check:first-child{border-top:0}
.check .box{width:20px;height:20px;border-radius:6px;margin:0}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:var(--raise);color:var(--ink);font-size:20px;cursor:pointer}
.stepper b{font:700 24px var(--f-num);min-width:36px;text-align:center}
.feel{display:flex;gap:6px}
.feel button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-size:20px;cursor:pointer}
.feel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.coach{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
/* Ziele */
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.tick{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.dots{display:flex;gap:4px;margin-top:4px}
.dots button{width:22px;height:22px;border-radius:6px;border:0;background:var(--raise);font:600 9.5px var(--f-body);color:var(--muted);cursor:pointer;padding:0}
.dots button.on{background:var(--good);color:#fff}
.dots button.today{outline:1.5px solid var(--accent)}
.dots button:disabled{opacity:.35;cursor:default}
.cnt{font:700 15px var(--f-num);text-align:right}
.cnt.done{color:var(--good)}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .pos{font:800 20px var(--f-display);text-align:center}
.rank.me{background:var(--accent-soft);border-radius:12px;padding:12px 8px;border-top-color:transparent}
.rank .pts{font:700 17px var(--f-num);text-align:right}
@media (prefers-reduced-motion:no-preference){.running .timer{animation:pulse 2s ease-in-out infinite}.bar i{transition:width .4s ease}}
@keyframes pulse{50%{opacity:.75}}
@media (max-width:380px){.pday{grid-template-columns:28px 74px 1fr 58px}.hero .big{font-size:36px}}

</style>

<div class="app" id="root" aria-live="polite"></div>

/* ================= Verbindung zu Claude ================= */
const App={db:null,user:null,sample:null,me:null,cloud:false,names:{},mods:{},order:[],cur:"home",tick:null};
async function getClaude(){for(let i=0;i<25;i++){if(window.claude&&window.claude.use)return window.claude;await new Promise(r=>setTimeout(r,100))}return null}

/* Privates Dokument: nur der Besitzer sieht es (data/users/<id>/<name>) */
class PrivateDoc{
  constructor(name,upgrade){this.name=name;this.upgrade=upgrade||(x=>x);this.S=null;this.loaded=false;this.ref=null;this.timer=null;this.saving=false;this.again=false}
  start(){
    if(App.cloud){
      this.ref=App.db.collection("data/users/"+App.me).doc(this.name);
      this.ref.onSnapshot(s=>{if(this.timer||this.saving)return;this.S=s.exists?this.upgrade(structuredClone(s.data())):null;this.loaded=true;rerender()},()=>{this.ref=null;this.local()});
    } else this.local();
  }
  local(){try{const r=localStorage.getItem("own-"+this.name);this.S=r?this.upgrade(JSON.parse(r)):null}catch(e){this.S=null}this.loaded=true;rerender()}
  save(){
    if(!this.ref){try{this.S===null?localStorage.removeItem("own-"+this.name):localStorage.setItem("own-"+this.name,JSON.stringify(this.S))}catch(e){}return}
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),450);
  }
  async flush(){
    this.timer=null;if(this.saving){this.again=true;return}
    this.saving=true;
    try{this.S===null?await this.ref.delete():await this.ref.set(JSON.parse(JSON.stringify(this.S)))}catch(e){toast("Speichern fehlgeschlagen – bitte nochmals versuchen")}
    this.saving=false;if(this.again){this.again=false;this.flush()}
  }
}
/* Geteilte Sammlung: alle mit Zugriff auf die App sehen sie */
class SharedCol{
  constructor(path){this.path=path;this.items=[];this.loaded=false;this.col=null}
  start(){
    if(App.cloud){this.col=App.db.collection(this.path);
      this.col.onSnapshot(s=>{this.items=s.docs.map(d=>({id:d.id,...d.data()}));this.loaded=true;resolveNames(this.items);rerender()},()=>{this.col=null;this.local()});}
    else this.local();
  }
  local(){try{this.items=JSON.parse(localStorage.getItem("own-"+this.path)||"[]")}catch(e){this.items=[]}this.loaded=true;rerender()}
  persist(){try{localStorage.setItem("own-"+this.path,JSON.stringify(this.items))}catch(e){}rerender()}
  async add(data,id){
    if(this.col){try{id?await this.col.doc(id).set(data):await this.col.add(data);return true}catch(e){toast(e&&e.code==="permission_denied"?"Keine Berechtigung zum Speichern":"Konnte nicht speichern");return false}}
    const i=id||uid();this.items=this.items.filter(x=>x.id!==i);this.items.push({id:i,...data});this.persist();return true;
  }
  async set(id,data){return this.add(data,id)}
  async update(id,data){
    if(this.col){try{await this.col.doc(id).update(data);return true}catch(e){toast("Konnte nicht speichern");return false}}
    const m=this.items.find(x=>x.id===id);if(m){for(const k in data){if(data[k]&&typeof data[k]==="object"&&!Array.isArray(data[k])&&m[k]&&typeof m[k]==="object")Object.assign(m[k],data[k]);else m[k]=data[k]}}this.persist();return true;
  }
  async remove(id){if(this.col){try{await this.col.doc(id).delete()}catch(e){}return}this.items=this.items.filter(x=>x.id!==id);this.persist()}
}
async function resolveNames(items){
  if(!App.user)return;
  const ids=[...new Set(items.flatMap(m=>[m.addedBy,m.owner,...Object.keys(m.ratings||{})]).filter(x=>x&&x.startsWith("u_")))].filter(id=>!(id in App.names));
  if(!ids.length)return;
  try{const ps=await App.user.profiles(ids);let ch=false;for(const id of ids){const p=ps[id];const n=p&&p.isMe?"Du":((p&&p.name)||"");App.names[id]=n;ch=true}if(ch)rerender()}catch(e){}
}
const who=id=>!id?"":id===App.me?"Du":(App.names[id]||"Jemand");

/* ================= Navigation & Rendern ================= */
function register(mod){App.mods[mod.id]=mod;App.order.push(mod.id)}
let pendingRender=false,rafId=0;
function typing(){const a=document.activeElement;return a&&$("#root").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!["button","checkbox","radio","date","time"].includes(a.type)))}
function rerender(){if(typing()){pendingRender=true;return}cancelAnimationFrame(rafId);rafId=requestAnimationFrame(render)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render()}},50));
function go(id){if(!App.mods[id])id="home";App.cur=id;try{if(location.hash.slice(1)!==id)location.hash=id}catch(e){}render();scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(App.mods[h]&&h!==App.cur){App.cur=h;render();scrollTo(0,0)}});
function render(){
  const m=App.mods[App.cur];
  document.body.dataset.mod=App.cur;
  $$(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===App.cur?"page":"false"));
  $("#root").innerHTML=m.view();
  const fab=$("#fab");fab.hidden=!m.fab||!m.fab();
  if(m.bind)m.bind();
  clearInterval(App.tick);if(m.tick)App.tick=setInterval(m.tick,250);
}
function sheet(html,onOpen){
  const host=$("#sheetHost");
  host.innerHTML=`<div class="sheet" id="sh"><div role="dialog">${html}</div></div>`;
  const close=()=>host.innerHTML="";
  $("#sh").onclick=e=>{if(e.target.id==="sh")close()};
  host.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  if(onOpen)onOpen(host,close);
  return close;
}
function seg(items,cur,attr){return `<div class="seg" role="tablist">${items.map(([k,l])=>`<button data-${attr}="${k}" aria-pressed="${k===cur}">${l}</button>`).join("")}</div>`}
function copyText(text,el){navigator.clipboard.writeText(text).then(()=>toast("Kopiert")).catch(()=>{if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("Text markiert – jetzt kopieren")})}

/* ================= Modul: Budget ================= */
(()=>{
const DEFAULT_CATS=[{id:"essen",name:"Essen & Snacks",limit:150},{id:"ausgang",name:"Ausgang",limit:120},{id:"kleider",name:"Kleider",limit:80},{id:"gaming",name:"Gaming",limit:40},{id:"oev",name:"Velo & ÖV",limit:30},{id:"geschenke",name:"Geschenke",limit:40},{id:"sonst",name:"Sonstiges",limit:60}];
const blank=()=>({v:1,income:0,saveRate:0,fixed:[],cats:DEFAULT_CATS.map(c=>({...c})),tx:[],goals:[],etf:{monthly:0,rate:4},example:false});
const doc=new PrivateDoc("budget",s=>{const b=blank();for(const k in b)if(s[k]===undefined)s[k]=b[k];return s});
let tab="home",cur=new Date();cur.setDate(1);
const B=()=>doc.S;
function commit(msg){doc.save();rerender();toast(msg)}

function monthTx(){const k=ym(cur);return B().tx.filter(t=>t.date.startsWith(k)).sort((a,b)=>b.date.localeCompare(a.date))}
function stats(){
  const S=B(),tx=monthTx(),spent=tx.reduce((a,t)=>a+t.amount,0),fixed=S.fixed.reduce((a,f)=>a+f.amount,0);
  const plan=S.income-fixed-S.saveRate-(S.etf.monthly||0),left=plan-spent;
  const now=new Date(),isNow=ym(now)===ym(cur),dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const daysLeft=isNow?dim-now.getDate()+1:0;const byCat={};tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  return {tx,spent,fixed,plan,left,daysLeft,byCat};
}
function summary(){if(!doc.loaded)return {text:"Lädt …",big:""};if(!B())return {text:"Noch nicht eingerichtet",big:""};const c0=cur;cur=new Date();cur.setDate(1);const st=stats();cur=c0;return {text:st.daysLeft?`Noch ${st.daysLeft} Tage · ${chf(Math.max(0,st.left/st.daysLeft),0)} CHF/Tag`:"diesen Monat",big:"CHF "+chf(st.left)}}

function view(){
  if(!doc.loaded)return `<h1>Budget</h1><p class="muted"><span class="spin"></span>Lädt …</p>`;
  if(!B())return onboarding();
  return `<div class="top"><h1>Budget</h1>${tab==="home"||tab==="tx"?monthNav():""}</div>`+seg([["home","Übersicht"],["tx","Ausgaben"],["goals","Sparen"],["set","Einstellungen"]],tab,"btab")+
    (B().example?`<p class="note"><span class="pill">Beispieldaten</span> Erfundene Zahlen zum Ausprobieren. Unter Einstellungen löschst du sie.</p>`:"")+
    (tab==="home"?home():tab==="tx"?txView():tab==="goals"?goalsView():settings());
}
function monthNav(){return `<div class="month"><button data-m="-1" aria-label="Vormonat">‹</button><span>${cur.toLocaleDateString("de-CH",{month:"long",year:"numeric"})}</span><button data-m="1" aria-label="Nächster Monat">›</button></div>`}
function onboarding(){
  return `<h1>Budget</h1><div class="card empty" style="border-style:solid"><h2>Wie viel kommt pro Monat rein?</h2>
    <p class="muted">Trag deinen Lehrlingslohn (netto) ein. Fixkosten, Kategorien und Sparziele passt du danach an.</p>
    <label style="width:100%">Lohn pro Monat in CHF<input id="ob-income" type="number" inputmode="decimal" placeholder="z.B. 950"></label>
    <button class="btn wide" id="ob-go">Los geht's</button><button class="btn ghost wide" id="ob-demo">Erst mit Beispieldaten ausprobieren</button></div>`;
}
function home(){
  const S=B(),st=stats(),pct=st.plan>0?Math.min(100,st.spent/st.plan*100):0,perDay=st.daysLeft?st.left/st.daysLeft:null;
  const cats=S.cats.map(c=>{const sp=st.byCat[c.id]||0,p=c.limit?sp/c.limit*100:0;return `<div class="item cat"><div class="t">${esc(c.name)}</div><div class="v num">${chf(sp)} <span class="muted">/ ${chf(c.limit)}</span></div><div class="bar ${p>100?"over":p>80?"near":""}"><i style="width:${Math.min(100,p)}%"></i></div></div>`}).join("");
  const g=S.goals[0];
  return `<section class="hero"><span class="lbl">Noch frei diesen Monat</span><div class="big num"><small>CHF</small>${chf(st.left)}</div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row" style="flex-wrap:wrap;gap:14px;font-size:13px"><span>Ausgegeben <b class="num">${chf(st.spent)}</b></span><span>Budget <b class="num">${chf(st.plan)}</b></span>${perDay!==null?`<span>Pro Tag <b class="num">${chf(Math.max(0,perDay),2)}</b></span>`:""}</div></section>
  <section class="card"><h2>So verteilt sich dein Lohn</h2><div class="list">
    <div class="item"><div class="t">Lohn</div><div class="v num">${chf(S.income)}</div></div>
    <div class="item"><div class="t">Fixkosten</div><div class="v num">−${chf(st.fixed)}</div></div>
    <div class="item"><div class="t">Sparen</div><div class="v num">−${chf(S.saveRate)}</div></div>
    <div class="item"><div class="t">ETF-Sparplan</div><div class="v num">−${chf(S.etf.monthly||0)}</div></div>
    <div class="item"><div class="t">Zum Ausgeben</div><div class="v num"><b>${chf(st.plan)}</b></div></div></div></section>
  <section class="card"><h2>Kategorien</h2><div class="list">${cats}</div></section>
  ${g?`<section class="card"><div class="top"><h2>${esc(g.name)}</h2><span class="pill">${Math.round(g.saved/g.target*100)}%</span></div><div class="bar"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><p class="note num">${chf(g.saved)} von ${chf(g.target)} CHF</p></section>`:""}`;
}
function txView(){
  const S=B(),st=stats();
  const rows=st.tx.map(t=>{const c=S.cats.find(c=>c.id===t.cat);return `<div class="item"><div><div class="t">${esc(t.note||c?.name||"Ausgabe")}</div><div class="note">${new Date(t.date).toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"})} · ${esc(c?.name||"–")}</div></div><div class="v"><span class="num">${chf(t.amount,2)}</span><button class="x" data-del="${t.id}" aria-label="Löschen">×</button></div></div>`}).join("");
  return `<section class="card">${rows?`<div class="list">${rows}</div>`:`<p class="muted">Noch keine Ausgaben in diesem Monat. Tipp unten rechts auf +.</p>`}</section><p class="note num">Total: CHF ${chf(st.spent,2)}</p>`;
}
function goalsView(){
  const S=B();
  const g=S.goals.map(g=>`<div class="item"><div class="t">${esc(g.name)}</div><div class="v"><span class="num">${chf(g.saved)} / ${chf(g.target)}</span> <button class="x" data-gdel="${g.id}" aria-label="Ziel löschen">×</button></div>
    <div class="bar" style="grid-column:1/-1"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div>
    <div class="inline" style="grid-column:1/-1">${[20,50,100].map(a=>`<button class="btn small ghost" data-gadd="${g.id}" data-amt="${a}">+${a}</button>`).join("")}
    ${g.saved<g.target&&S.saveRate>0?`<span class="note">bei ${chf(S.saveRate)}/Mt. in ca. ${Math.ceil((g.target-g.saved)/S.saveRate)} Monaten</span>`:""}</div></div>`).join("");
  const m=S.etf.monthly||0,r=(S.etf.rate||0)/100/12,fv=n=>r?m*((Math.pow(1+r,n*12)-1)/r):m*n*12;
  return `<section class="card"><h2>Sparziele</h2>${g?`<div class="list">${g}</div>`:`<p class="muted">Noch kein Ziel – zum Beispiel neues Velo, Ferien oder Führerausweis.</p>`}
    <div class="inline"><label>Ziel<input id="g-name" placeholder="z.B. Neues Velo"></label><label style="flex:0 1 110px">CHF<input id="g-target" type="number" inputmode="decimal" placeholder="1200"></label><button class="btn" id="g-add">Hinzufügen</button></div></section>
  <section class="card"><h2>ETF-Sparplan</h2><p class="note">Zeigt, wie ein monatlicher Betrag wachsen könnte. Die Rendite ist eine Annahme zum Rechnen, keine Prognose und keine Anlageberatung.</p>
    <div class="grid2"><label>Pro Monat (CHF)<input id="etf-m" type="number" inputmode="decimal" value="${m||""}" placeholder="50"></label><label>Rendite-Annahme % p.a.<input id="etf-r" type="number" inputmode="decimal" step="0.5" value="${S.etf.rate}"></label></div>
    <div class="proj"><div><b>${chf(fv(5))}</b><span>nach 5 Jahren</span></div><div><b>${chf(fv(10))}</b><span>nach 10 Jahren</span></div><div><b>${chf(fv(20))}</b><span>nach 20 Jahren</span></div></div>
    <p class="note num">Selbst einbezahlt nach 10 Jahren: CHF ${chf(m*120)}</p></section>`;
}
function settings(){
  const S=B();
  const fx=S.fixed.map(f=>`<div class="item"><div class="t">${esc(f.name)}</div><div class="v"><span class="num">${chf(f.amount,2)}</span><button class="x" data-fdel="${f.id}" aria-label="Löschen">×</button></div></div>`).join("");
  const cs=S.cats.map(c=>`<div class="item"><div class="t">${esc(c.name)}</div><div class="v"><input class="num" style="width:90px" type="number" inputmode="decimal" data-lim="${c.id}" value="${c.limit}" aria-label="Limit ${esc(c.name)}"></div></div>`).join("");
  return `<section class="card"><h2>Einnahmen</h2><div class="grid2"><label>Lohn pro Monat<input id="s-income" type="number" inputmode="decimal" value="${S.income}"></label><label>Fix sparen pro Monat<input id="s-save" type="number" inputmode="decimal" value="${S.saveRate}"></label></div></section>
  <section class="card"><h2>Fixkosten</h2>${fx?`<div class="list">${fx}</div>`:`<p class="muted">Zum Beispiel Handy-Abo, Streaming oder Gym-Abo.</p>`}
    <div class="inline"><label>Name<input id="f-name" placeholder="Handy-Abo"></label><label style="flex:0 1 100px">CHF<input id="f-amt" type="number" inputmode="decimal" placeholder="25"></label><button class="btn" id="f-add">+</button></div></section>
  <section class="card"><h2>Monatslimit pro Kategorie</h2><div class="list">${cs}</div><div class="inline"><label>Neue Kategorie<input id="c-name" placeholder="z.B. Gym"></label><button class="btn" id="c-add">+</button></div></section>

/* ================= Modul: Filmabend (geteilt) ================= */
(()=>{
const movies=new SharedCol("movies");
let tab="find",listFilter="watch",results=[],searching=false,searchNote="",calMonth=new Date(),selDay=null;calMonth.setDate(1);
const M=()=>movies.items;
const keyOf=m=>(m.title+"|"+(m.year||"")).toLowerCase();
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function poster(t){const h=hue(t),h2=(h+50)%360;return `<div class="poster" style="background:linear-gradient(160deg,hsl(${h} 62% 52%),hsl(${h2} 55% 26%))">${esc(t)}</div>`}
const jw=t=>"https://www.justwatch.com/ch/Suche?q="+encodeURIComponent(t);

const PROV_SPEC=`Liste, wo man den Film in der Schweiz schauen kann: [{"name": einer von "Netflix","Disney+","Prime Video","Apple TV+","Sky Show","Play Suisse","SRF Play","Blue TV","Canal+","Paramount+","Apple iTunes","Google Play", "type": "flat" (im Abo enthalten) oder "rent" (leihen/kaufen), "sure": true wenn du dir ziemlich sicher bist, sonst false}]. Gib IMMER deine beste Einschätzung an – mindestens die Plattform, auf der der Film am wahrscheinlichsten im Abo ist, und eine Leih-Option (Apple iTunes oder Google Play gibt es fast immer). Markiere Vermutungen mit "sure": false statt sie wegzulassen.`;
const PROMPT=(q,mode)=>`Du bist eine Film-Datenbank für ein Paar in der Schweiz. ${mode==="mood"?`Schlage 6 passende Filme vor für diese Stimmung: "${q}". Mische bekannte und weniger bekannte Filme.`:`Finde bis zu 6 Filme, die zur Suche "${q}" passen (Titel, Schauspieler, Regisseur oder Thema). Bester Treffer zuerst.`}
Antworte NUR mit einem JSON-Array. Jedes Element:
{"title": deutscher Verleihtitel falls üblich sonst Originaltitel, "original": Originaltitel, "year": Zahl, "genre": kurz auf Deutsch, "runtime": Minuten als Zahl, "desc": ein Satz auf Deutsch ohne Spoiler, "providers": ${PROV_SPEC}}`;
const PROV_PROMPT=m=>`Wo kann man den Film "${m.title}"${m.year?" ("+m.year+")":""} in der Schweiz streamen? Antworte NUR mit JSON: ${PROV_SPEC}`;

async function runSearch(q,mode){
  if(!q.trim())return;
  if(!App.sample){searchNote="Die Suche braucht Claude. Öffne die App über deinen Claude-Link.";results=[];render();return}
  searching=true;searchNote="";render();
  try{const r=await App.sample.json(PROMPT(q.trim(),mode),{modelTier:"default"});results=Array.isArray(r)?r.filter(x=>x&&x.title).slice(0,8):[];if(!results.length)searchNote="Nichts gefunden. Versuch einen anderen Titel."}
  catch(e){results=[];searchNote=e&&e.code==="not_granted"?"Die Suche braucht deine Erlaubnis, Claude zu fragen.":e&&e.code==="rate_limited"?"Zu viele Anfragen – kurz warten.":"Suche fehlgeschlagen. Nochmals versuchen."}
  searching=false;render();
}
async function refreshProv(id){
  const m=M().find(x=>x.id===id);if(!m)return;
  if(!App.sample){toast("Geht nur über deinen Claude-Link");return}
  toast("Claude prüft Streaming …");
  try{const r=await App.sample.json(PROV_PROMPT(m),{modelTier:"default",cache:false});const p=Array.isArray(r)?r.filter(x=>x&&x.name):[];await movies.update(id,{providers:p});toast(p.length?"Streaming aktualisiert":"Nichts gefunden – auf JustWatch prüfen")}
  catch(e){toast("Konnte nicht prüfen")}
}
async function addMovie(m,extra={}){
  if(M().some(x=>keyOf(x)===keyOf(m))){toast("Ist schon auf eurer Liste");return}
  const ok=await movies.add({title:m.title,year:m.year||null,genre:m.genre||"",runtime:m.runtime||null,desc:m.desc||"",providers:m.providers||[],status:"watch",date:null,addedBy:App.me,ratings:{},createdAt:Date.now(),...extra});
  if(ok)toast(extra.status==="planned"?"Filmabend eingetragen":"Auf die Liste gesetzt");
}
function provHTML(p){if(!p||!p.length)return `<span class="note">Noch keine Streaming-Info</span>`;return p.map(x=>`<span class="${x.type==="flat"?"flat":"rent"} ${x.sure===false?"maybe":""}">${esc(x.name)}${x.type==="rent"?" · leihen":""}${x.sure===false?" ?":""}</span>`).join("")}
const metaLine=m=>[m.year,m.genre,m.runtime?m.runtime+" Min.":""].filter(Boolean).map(esc).join(" · ");
const fmtWhen=d=>new Date(d).toLocaleString("de-CH",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});

function nextPlanned(){const now=Date.now()-3*3600e3;return M().filter(m=>m.status==="planned"&&m.date&&new Date(m.date).getTime()>=now).sort((a,b)=>a.date.localeCompare(b.date))[0]}
function summary(){if(!movies.loaded)return {text:"Lädt …",big:""};const n=nextPlanned();if(n)return {text:"Nächster Filmabend: "+n.title,big:new Date(n.date).toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"})};const w=M().filter(m=>m.status==="watch").length;return {text:w?w+(w===1?" Film":" Filme")+" auf der Merkliste":"Noch keine Filme gemerkt",big:""}}

function view(){
  return `<h1>${tab==="find"?"Was schauen wir?":tab==="list"?"Unsere Liste":"Filmabende"}</h1>`+seg([["find","Entdecken"],["list","Unsere Liste"],["cal","Kalender"]],tab,"ftab")+(tab==="find"?findV():tab==="list"?listV():calV());
}
function findV(){
  const moods=["Romantisch","Lustig","Spannend","Gruselig","Feelgood","Animation","Kurz (unter 100 Min.)"];
  const res=searching?`<p class="muted"><span class="spin"></span>Claude sucht Filme …</p>`:
    results.length?`<div class="films">${results.map((m,i)=>{const on=M().some(x=>keyOf(x)===keyOf(m));return `<article class="film">${poster(m.title)}<div class="body"><h3>${esc(m.title)}</h3><div class="meta">${metaLine(m)}${m.original&&m.original!==m.title?" · "+esc(m.original):""}</div>
      <div class="note" style="color:var(--ink)">${esc(m.desc)}</div><div class="prov">${provHTML(m.providers)}</div>
      <div class="actions"><button class="btn small" data-add="${i}" ${on?"disabled":""}>${on?"Auf der Liste":"+ Merken"}</button><button class="btn small ghost" data-plan="${i}">Planen</button><a class="btn small ghost" href="${jw(m.title)}" target="_blank" rel="noopener">Prüfen ↗</a></div></div></article>`}).join("")}</div>
      <p class="note">Streaming-Angaben aus Claudes Wissen (Stand Mitte 2026). Gestrichelt mit «?» = Vermutung. «Prüfen» öffnet JustWatch Schweiz.</p>`:
    `<div class="empty"><h2>Film suchen oder Stimmung wählen</h2><p class="muted">Titel, Schauspieler oder Thema eintippen. Claude zeigt, wo der Film in der Schweiz läuft.</p></div>`;
  return `<form class="row" id="sf"><input id="q" placeholder="Titel, Schauspieler, Thema …" autocomplete="off" aria-label="Film suchen"><button class="btn" type="submit">Suchen</button></form>
  <div class="chips">${moods.map(m=>`<button data-mood="${esc(m)}">${esc(m)}</button>`).join("")}</div>${searchNote?`<p class="note">${esc(searchNote)}</p>`:""}${res}`;
}
function card(m){
  const st=m.status,mine=(m.ratings||{})[App.me||"local"]||0;
  return `<article class="film">${poster(m.title)}<div class="body">
    ${st==="planned"&&m.date?`<span class="badge">Geplant · ${esc(new Date(m.date).toLocaleString("de-CH",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>`:st==="seen"?`<span class="badge" style="color:var(--good)">Gesehen</span>`:""}
    <h3>${esc(m.title)}</h3><div class="meta">${metaLine(m)}${m.addedBy?" · von "+esc(who(m.addedBy)):""}</div><div class="prov">${provHTML(m.providers)}</div>
    ${st==="seen"?`<div class="row" style="flex-wrap:wrap"><div class="stars" aria-label="Deine Bewertung">${[1,2,3,4,5].map(n=>`<button data-rate="${m.id}" data-n="${n}" class="${n<=mine?"on":""}" aria-label="${n} Herzen">♥</button>`).join("")}</div>
      <span class="note">${Object.entries(m.ratings||{}).filter(([k])=>k!==App.me&&k!=="local").map(([k,v])=>esc(who(k))+": "+"♥".repeat(v)).join(" · ")}</span></div>`:""}
    <div class="actions">${st!=="seen"?`<button class="btn small" data-planid="${m.id}">${st==="planned"?"Verschieben":"Planen"}</button>`:""}
      ${st==="planned"?`<button class="btn small ghost" data-cal="${m.id}">In Kalender</button>`:""}${st!=="seen"?`<button class="btn small ghost" data-seen="${m.id}">Gesehen</button>`:""}
      <button class="btn small ghost" data-prov="${m.id}">${(m.providers||[]).length?"Streaming neu prüfen":"Streaming suchen"}</button>
      <a class="btn small ghost" href="${jw(m.title)}" target="_blank" rel="noopener">JustWatch ↗</a><button class="btn small ghost" data-rm="${m.id}">Entfernen</button></div></div></article>`;
}
function listV(){
  if(!movies.loaded)return `<p class="muted"><span class="spin"></span>Lädt eure Liste …</p>`;
  const g={watch:M().filter(m=>m.status==="watch"),planned:M().filter(m=>m.status==="planned").sort((a,b)=>(a.date||"").localeCompare(b.date||"")),seen:M().filter(m=>m.status==="seen")};
  const L=g[listFilter];
  return `<div class="chips">${[["watch","Merkliste"],["planned","Geplant"],["seen","Gesehen"]].map(([k,l])=>`<button data-lf="${k}" aria-pressed="${listFilter===k}">${l} (${g[k].length})</button>`).join("")}</div>
  ${listFilter==="watch"&&L.length>1?`<button class="btn ghost" id="random">🎲 Zufallsfilm für heute</button>`:""}
  ${L.length?`<div class="films">${L.map(card).join("")}</div>`:`<div class="empty"><p class="muted">${listFilter==="watch"?"Noch nichts gemerkt. Such unter «Entdecken» einen Film.":listFilter==="planned"?"Noch kein Filmabend geplant.":"Hier landen gesehene Filme mit euren Bewertungen."}</p></div>`}
  <p class="note">${movies.col?"Diese Liste ist geteilt: Alle, mit denen du die App teilst, sehen sie.":"Nur in diesem Browser gespeichert."}</p>`;
}
function calV(){
  const planned=M().filter(m=>m.status==="planned"&&m.date),next=nextPlanned();
  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),start=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
  const byDay={};planned.forEach(m=>{const k=m.date.slice(0,10);(byDay[k]=byDay[k]||[]).push(m)});
  let cells=WD.map(d=>`<div class="dow">${d}</div>`).join("");for(let i=0;i<start;i++)cells+="<div></div>";
  const today=dkey(new Date());
  for(let d=1;d<=dim;d++){const k=y+"-"+pad(mo+1)+"-"+pad(d);cells+=`<button class="day ${k===today?"today":""} ${k===selDay?"sel":""}" data-day="${k}">${d}${byDay[k]?`<span class="dot"></span>`:""}</button>`}
  const dl=selDay?(byDay[selDay]||[]):[];
  return `${next?`<section class="next"><span class="badge">Nächster Filmabend</span><div class="when">${esc(fmtWhen(next.date))}</div><h2>${esc(next.title)}</h2><div class="prov">${provHTML(next.providers)}</div></section>`:`<div class="empty"><p class="muted">Kein Filmabend geplant. Wählt in eurer Liste einen Film und tippt auf «Planen».</p></div>`}
  <section class="card"><div class="top"><button class="back" data-cm="-1" aria-label="Vormonat">‹</button><h2>${calMonth.toLocaleDateString("de-CH",{month:"long",year:"numeric"})}</h2><button class="back" data-cm="1" aria-label="Nächster Monat">›</button></div><div class="calgrid">${cells}</div></section>
  ${selDay?`<div class="films">${dl.length?dl.map(card).join(""):`<p class="note">An diesem Tag ist nichts geplant.</p>`}</div>`:""}
  <p class="note">Sperrbildschirm: Trag Filmabende mit «In Kalender» in euren gemeinsamen Apple-Kalender ein – das Kalender-Widget von Apple zeigt sie dann an.</p>`;
}
function nextFriday(){const d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7||7));return dkey(d)}
function openPlan(m,isNew,random){
  sheet(`<div class="top"><h2>${random?"Heute schaut ihr …":"Filmabend planen"}</h2><button class="x" data-close aria-label="Schliessen">×</button></div>
    <div class="film" style="border:0;padding:0">${poster(m.title)}<div class="body"><h3>${esc(m.title)}</h3><div class="meta">${metaLine(m)}</div><div class="prov">${provHTML(m.providers)}</div></div></div>
    <div class="row"><input type="date" id="pd" value="${m.date?m.date.slice(0,10):nextFriday()}" aria-label="Datum"><input type="time" id="pt" value="${m.date?m.date.slice(11,16):"20:00"}" aria-label="Zeit" style="max-width:120px"></div>
    <button class="btn" id="psave">Eintragen</button>`,(host,close)=>{
    $("#psave").onclick=async()=>{const date=$("#pd").value+"T"+($("#pt").value||"20:00");
      if(isNew)await addMovie(m,{status:"planned",date});else{await movies.update(m.id,{status:"planned",date});toast("Filmabend eingetragen")}
      close();tab="cal";const d=new Date(date);calMonth=new Date(d.getFullYear(),d.getMonth(),1);selDay=date.slice(0,10);render()};
  });
}
function openCal(m){
  const d=new Date(m.date),end=new Date(d.getTime()+((m.runtime||120)+15)*60000);
  const text=`🍿 ${m.title}\n${fmtWhen(d)} – ${end.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}\n${(m.providers||[]).filter(p=>p.type==="flat").map(p=>p.name).join(", ")||"Streaming prüfen"}`;
  const g=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const gUrl="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("🍿 "+m.title)+"&dates="+g(d)+"/"+g(end);
  sheet(`<div class="top"><h2>In den Kalender</h2><button class="x" data-close aria-label="Schliessen">×</button></div>
    <p class="muted">Text kopieren, in der Apple-Kalender-App ein neues Ereignis im gemeinsamen Kalender erstellen und einfügen.</p>
    <div class="copy" id="ctext">${esc(text)}</div><div class="actions"><button class="btn" id="ccopy">Text kopieren</button><a class="btn ghost" href="${gUrl}" target="_blank" rel="noopener">Google Kalender ↗</a></div>
    <p class="note">Oder schreib Claude im Chat: «Trag den Filmabend ein» – dann macht Claude das für dich.</p>`,()=>{$("#ccopy").onclick=()=>copyText(text,$("#ctext"))});

function bind(){

  $$("[data-planid]").forEach(b=>b.onclick=()=>openPlan(M().find(m=>m.id===b.dataset.planid),false));
  $$("[data-seen]").forEach(b=>b.onclick=()=>{movies.update(b.dataset.seen,{status:"seen"});toast("Als gesehen markiert – jetzt bewerten")});
  $$("[data-rm]").forEach(b=>b.onclick=()=>movies.remove(b.dataset.rm));
  $$("[data-prov]").forEach(b=>b.onclick=()=>refreshProv(b.dataset.prov));
  $$("[data-rate]").forEach(b=>b.onclick=()=>movies.update(b.dataset.rate,{ratings:{[App.me||"local"]:+b.dataset.n}}));
  $$("[data-cal]").forEach(b=>b.onclick=()=>openCal(M().find(m=>m.id===b.dataset.cal)));
  $$("[data-lf]").forEach(b=>b.onclick=()=>{listFilter=b.dataset.lf;render()});
  $$("[data-cm]").forEach(b=>b.onclick=()=>{calMonth.setMonth(calMonth.getMonth()+ +b.dataset.cm);render()});
  $$("[data-day]").forEach(b=>b.onclick=()=>{selDay=selDay===b.dataset.day?null:b.dataset.day;render()});
  const r=$("#random");if(r)r.onclick=()=>{const L=M().filter(m=>m.status==="watch");openPlan(L[Math.floor(Math.random()*L.length)],false,true)};
}
register({id:"film",title:"Film",icon:"film",col:movies,view,bind,summary});
})();

function streak(){const days=new Set(S().sessions.map(s=>new Date(s.ts).toDateString()));let n=0,d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}

  <div class="stats"><div class="stat"><b>${streak()}</b><span>Tage Streak</span></div><div class="stat"><b>${Math.round(wk/6)/10}</b><span>Std. diese Woche</span></div><div class="stat"><b>${goal?Math.min(999,Math.round(wk/goal*100)):0}%</b><span>vom Wochenziel</span></div></div>

function tick(){

let rTimer=null,rStart=0;
function reactTap(e){e.preventDefault();
  if(["idle","done","early"].includes(react.st)){react={st:"wait"};render();clearTimeout(rTimer);rTimer=setTimeout(()=>{react={st:"go"};rStart=performance.now();render()},1500+Math.random()*2500);return}
  if(react.st==="wait"){clearTimeout(rTimer);react={st:"early"};render();return}
  if(react.st==="go"){const ms=Math.round(performance.now()-rStart);react={st:"done",ms};S().reaction=[...S().reaction,ms].slice(-60);commit(S().reaction.length>1&&ms<=Math.min(...S().reaction)?"Neue Bestzeit!":"")}
}
let cTimer=null;
function cpsTap(e){e.preventDefault();
  if(!cpsRun||cpsRun.end<=Date.now()){if(cpsRun&&cpsRun.result==null)return;cpsRun={n:0,end:Date.now()+10000,result:null};render();clearTimeout(cTimer);
    cTimer=setTimeout(()=>{cpsRun.result=cpsRun.n/10;S().cps=[...S().cps,cpsRun.result].slice(-60);commit(cpsRun.result>=Math.max(...S().cps)?"Neuer Rekord!":"")},10000);return}
  cpsRun.n++;const c=$("#cc");if(c)c.textContent=cpsRun.n;
}
function openFinish(min,k,dr,manual){
  let w=0,l=0,feel=4,tmp=null;
  const keep=()=>{tmp={k:$("#fk").value,m:$("#fm").value,sv:$("#fsv").value,n:$("#fn").value}};
  const restore=()=>{if(!tmp)return;$("#fk").value=tmp.k;$("#fm").value=tmp.m;$("#fsv").value=tmp.sv;$("#fn").value=tmp.n};
  const draw=()=>sheet(`<div class="top"><h2>${manual?"Session nachtragen":"Session speichern"}</h2><button class="x" data-close aria-label="Schliessen">×</button></div>
    <div class="grid2"><label>Kit<select id="fk">${KITS.map(x=>`<option ${x===k?"selected":""}>${x}</option>`).join("")}</select></label><label>Minuten<input id="fm" type="number" inputmode="numeric" value="${min}"></label></div>
    <div class="grid2"><div><span class="note">Wins</span><div class="stepper"><button data-s="w-">−</button><b class="w">${w}</b><button data-s="w+">+</button></div></div><div><span class="note">Losses</span><div class="stepper"><button data-s="l-">−</button><b class="l">${l}</b><button data-s="l+">+</button></div></div></div>
    <div><span class="note">Wie lief's?</span><div class="feel">${["😖","😕","😐","🙂","🔥"].map((e,i)=>`<button data-feel="${i+1}" aria-pressed="${feel===i+1}" aria-label="Gefühl ${i+1} von 5">${e}</button>`).join("")}</div></div>
    <label>Server<select id="fsv"><option value="">–</option>${S().servers.map(s=>`<option ${s===S().lastServer?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
    <label>Notiz<textarea id="fn" rows="2" placeholder="Was lief gut, was nicht?"></textarea></label><button class="btn" id="fsave">Speichern</button>`,(host,close)=>{
    host.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{keep();const v=b.dataset.s;if(v==="w+")w++;if(v==="w-")w=Math.max(0,w-1);if(v==="l+")l++;if(v==="l-")l=Math.max(0,l-1);draw();restore()});
    host.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{keep();feel=+b.dataset.feel;draw();restore()});
    $("#fsave").onclick=()=>{const kk=$("#fk").value,mm=Math.max(1,+$("#fm").value||1),sv=$("#fsv").value;
      S().sessions.push({id:uid(),ts:manual?Date.now()-mm*60000:run.start,kit:kk,min:mm,w,l,feel,server:sv,drills:dr,note:$("#fn").value.trim()});S().lastServer=sv;
      if(!manual){run=null;persistRun()}close();drills.clear();commit("Session gespeichert 🔥");if(l>=3&&w===0)setTimeout(()=>toast("3+ Losses – gönn dir eine Pause"),2100)};
  });
  draw();
}

  coachBusy=true;coachText="";render();
  const s=S(),recent=s.sessions.slice(-25).map(x=>({datum:dkey(x.ts),kit:x.kit,min:x.min,w:x.w,l:x.l,gefuehl:x.feel,drills:x.drills,notiz:x.note}));
  const reviews=s.reviews.slice(-15).map(r=>({kit:r.kit,fehler:r.tags,was:r.what,lektion:r.lesson}));
  const prompt=`Du bist ein Minecraft-PvP-Coach (Java 1.21, MCTiers-Modi). Antworte auf Deutsch (Schweizer Schreibweise mit ss), kurz und konkret, ohne Markdown-Überschriften, Aufzählungen mit "•".
Spieler: ${s.ign}. Wochenplan: ${JSON.stringify(s.plan.map((p,i)=>WD[i]+" "+p.time+" "+(p.kit||"auto")+" "+p.min+"min"))}
Tier-Stand und Ziele: ${JSON.stringify(s.tiers)}
Lernstand Drills: ${JSON.stringify(s.drillStatus)}
Letzte Sessions: ${JSON.stringify(recent)}
Fight-Reviews: ${JSON.stringify(reviews)}
Bester Reaktionstest: ${s.reaction.length?Math.min(...s.reaction)+" ms":"keiner"}
Frage: ${q}`;
  try{await App.sample(prompt,{modelTier:"default",cache:false,onText:({text})=>{coachText=text;const e=$("#ct");if(e)e.textContent=text;else rerender()}})}
  catch(e){coachText=e&&e.code==="not_granted"?"Der Coach braucht deine Erlaubnis, Claude zu fragen.":"Der Coach ist gerade nicht erreichbar. Versuch es gleich nochmal."}
  coachBusy=false;render();
}
register({id:"training",title:"Training",icon:"training",doc,view,bind,tick,summary});
})();

/* ================= Modul: Ziele-Challenge (geteilt, jeder schreibt nur seine eigenen Ziele) ================= */
(()=>{
const END=new Date("2027-01-01T00:00:00");
const PRESETS=[["Velo fahren",2],["Gym",2],["Bewusst essen",7],["7 Std. Schlaf",7],["Lesen",3],["Calisthenics",3],["Morgenroutine",5],["Lernen",3],["Jemand Neues ansprechen",1]];
const BONUS=25,PER=10;
const col=new SharedCol("challenge");
let tab="today",weekOff=0;
const myId=()=>App.me||"local";
const mine=()=>col.items.find(x=>x.id===myId());
const people=()=>col.items.filter(x=>x.goals&&x.goals.length);
function save(d){d.owner=myId();d.updatedAt=Date.now();const {id,...data}=d;col.set(myId(),JSON.parse(JSON.stringify(data)))}
function weekDays(off){const m=mondayOf(new Date());m.setDate(m.getDate()+off*7);return WD.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return dkey(d)})}
const done=(p,day,gid)=>((p.log||{})[day]||[]).includes(gid);
function weekCount(p,g,days){return days.filter(d=>done(p,d,g.id)).length}
function weekPct(p,days){const t=p.goals.reduce((a,g)=>a+g.target,0);if(!t)return 0;return Math.round(p.goals.reduce((a,g)=>a+Math.min(g.target,weekCount(p,g,days)),0)/t*100)}
function points(p){
  const log=p.log||{},checks=Object.values(log).reduce((a,l)=>a+l.length,0);
  const dates=Object.keys(log).filter(d=>log[d].length);if(!dates.length)return 0;
  const first=mondayOf(dates.sort()[0]+"T12:00"),now=mondayOf(new Date());let bonus=0;
  for(let m=new Date(first);m<=now;m.setDate(m.getDate()+7)){const off=Math.round((m-now)/(7*864e5));const days=weekDays(off);p.goals.forEach(g=>{if(weekCount(p,g,days)>=g.target)bonus+=BONUS})}
  return checks*PER+bonus;
}
function streak(p){let n=0;const d=new Date();if(!((p.log||{})[dkey(d)]||[]).length)d.setDate(d.getDate()-1);while(((p.log||{})[dkey(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
const daysLeft=()=>Math.max(0,Math.ceil((END-new Date())/864e5));
function ranking(){return people().map(p=>({p,pts:points(p),wk:weekPct(p,weekDays(0)),st:streak(p)})).sort((a,b)=>b.pts-a.pts||b.wk-a.wk)}
function summary(){if(!col.loaded)return {text:"Lädt …",big:""};const m=mine();if(!m||!m.goals?.length)return {text:"Ziele festlegen",big:""};const r=ranking(),pos=r.findIndex(x=>x.p.id===myId())+1;const days=weekDays(0),d=m.goals.reduce((a,g)=>a+Math.min(g.target,weekCount(m,g,days)),0),t=m.goals.reduce((a,g)=>a+g.target,0);return {text:`Diese Woche ${d}/${t}${r.length>1?" · Platz "+pos+" von "+r.length:""}`,big:weekPct(m,days)+"%"}}

function view(){
  if(!col.loaded)return `<h1>Ziele</h1><p class="muted"><span class="spin"></span>Lädt …</p>`;
  const m=mine();
  if(!m||!m.goals||!m.goals.length)return `<h1>Ziele-Challenge</h1>`+setupV(true);
  return `<div class="top"><h1>Ziele-Challenge</h1><span class="pill num">noch ${daysLeft()} Tage</span></div>`+seg([["today","Diese Woche"],["rank","Rangliste"],["goals","Meine Ziele"]],tab,"ztab")+(tab==="today"?todayV(m):tab==="rank"?rankV():setupV(false));
}
function todayV(m){
  const days=weekDays(weekOff),today=dkey(new Date()),pct=weekPct(m,days);
  const from=new Date(days[0]+"T12:00").toLocaleDateString("de-CH",{day:"numeric",month:"short"}),to=new Date(days[6]+"T12:00").toLocaleDateString("de-CH",{day:"numeric",month:"short"});
  return `<section class="hero"><div class="top"><span class="lbl">${weekOff===0?"Diese Woche":"Woche "+from+" – "+to}</span><span class="note">${streak(m)?"🔥 "+streak(m)+(streak(m)===1?" Tag":" Tage")+" am Stück":""}</span></div>
    <div class="big num">${pct}<small style="margin-left:4px">%</small></div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row" style="justify-content:space-between"><button class="btn small clear" data-wk="-1">‹ Vorwoche</button>${weekOff<0?`<button class="btn small clear" data-wk="1">Nächste ›</button>`:`<span class="note">${points(m)} Punkte total</span>`}</div></section>
  <section class="card">${m.goals.map(g=>{const c=weekCount(m,g,days),ok=c>=g.target,isNow=weekOff===0;return `<div class="goal">
      ${isNow?`<button class="tick" data-tick="${g.id}" aria-pressed="${done(m,today,g.id)}" aria-label="${esc(g.name)} heute erledigt">✓</button>`:`<span class="tick" aria-hidden="true" style="color:var(--muted)">${ok?"✓":"–"}</span>`}
      <div style="min-width:0"><h3>${esc(g.name)}</h3><div class="dots">${days.map((d,i)=>`<button data-dot="${g.id}" data-day="${d}" class="${done(m,d,g.id)?"on":""} ${d===today?"today":""}" ${d>today?"disabled":""} aria-label="${WD[i]} ${esc(g.name)}">${WD[i]}</button>`).join("")}</div></div>
      <span class="cnt ${ok?"done":""}">${c}/${g.target}${ok?" ✓":""}</span></div>`}).join("")}</section>
  <p class="note">Tippe auf ✓ für heute oder auf einen Tag, um etwas nachzutragen. Pro Häkchen gibt's ${PER} Punkte, für jedes erreichte Wochenziel ${BONUS} Bonus-Punkte.</p>`;
}
function rankV(){
  const r=ranking();
  return `<section class="card"><div class="top"><h2>Rangliste</h2><span class="note">bis 1. Januar 2027</span></div>
    ${r.map((x,i)=>`<div class="rank ${x.p.id===myId()?"me":""}"><span class="pos">${["🥇","🥈","🥉"][i]||i+1}</span><div><b>${esc(who(x.p.owner||x.p.id))}</b><div class="note">${x.p.goals.length} Ziele · diese Woche ${x.wk}%${x.st?" · 🔥 "+x.st:""}</div><div class="bar" style="margin-top:6px"><i style="width:${x.wk}%"></i></div></div><span class="pts">${x.pts}</span></div>`).join("")}</section>
  ${r.length<2?`<div class="empty"><p class="muted">Noch bist du allein. Teile die App mit Levin und Yanic – sobald sie ihre Ziele festlegen, erscheinen sie hier.</p></div>`:""}
  <section class="card"><h2>Ziele der anderen</h2>${r.filter(x=>x.p.id!==myId()).map(x=>`<div class="item"><div class="t">${esc(who(x.p.owner||x.p.id))}</div><div class="note">${x.wk}%</div><div class="s">${x.p.goals.map(g=>esc(g.name)+" "+weekCount(x.p,g,weekDays(0))+"/"+g.target).join(" · ")}</div></div>`).join("")||`<p class="note">Noch niemand.</p>`}</section>`;
}
let draft=null;
function setupV(first){
  const m=mine();if(!draft)draft=(m&&m.goals?m.goals:[]).map(g=>({...g}));
  return `${first?`<section class="card"><h2>Welche Ziele willst du bis 1.1.2027 schaffen?</h2><p class="muted">Wähl Vorschläge oder schreib eigene. Lege fest, wie oft pro Woche. Levin und Yanic sehen deine Ziele und Häkchen, aber nichts aus Budget oder Training.</p></section>`:""}
  <section class="card"><h2>Meine Ziele</h2>${draft.length?draft.map((g,i)=>`<div class="item"><div class="t">${esc(g.name)}</div><div class="stepper"><button data-tg="${i}" data-d="-1" aria-label="weniger">−</button><b>${g.target}</b><button data-tg="${i}" data-d="1" aria-label="mehr">+</button><button class="x" data-gdel="${i}" aria-label="Ziel löschen">×</button></div><div class="s">${g.target}× pro Woche</div></div>`).join(""):`<p class="note">Noch keine Ziele gewählt.</p>`}
    <span class="note">Vorschläge</span><div class="chips">${PRESETS.filter(([n])=>!draft.some(g=>g.name===n)).map(([n,t])=>`<button data-pre="${esc(n)}" data-t="${t}">+ ${esc(n)}</button>`).join("")}</div>
    <div class="inline"><label>Eigenes Ziel<input id="zg-n" placeholder="z.B. 10 Liegestütze"></label><button class="btn" id="zg-add">+</button></div>
    <button class="btn" id="zg-save" ${draft.length?"":"disabled"}>${first?"Challenge starten":"Speichern"}</button></section>`;
}
function bind(){
  const on=(q,f)=>{const e=$(q);if(e)e.onclick=f};
  $$("[data-ztab]").forEach(b=>b.onclick=()=>{tab=b.dataset.ztab;draft=null;render()});
  $$("[data-wk]").forEach(b=>b.onclick=()=>{weekOff=Math.min(0,weekOff+ +b.dataset.wk);render()});
  const toggle=(gid,day)=>{const m=structuredClone(mine());m.log=m.log||{};const L=new Set(m.log[day]||[]);const add=!L.has(gid);add?L.add(gid):L.delete(gid);if(L.size)m.log[day]=[...L];else delete m.log[day];save(m);
    const g=m.goals.find(x=>x.id===gid),days=weekDays(weekOff);if(add&&g&&weekCount(m,g,days)===g.target)toast("Wochenziel «"+g.name+"» geschafft! +"+BONUS)};
  $$("[data-tick]").forEach(b=>b.onclick=()=>toggle(b.dataset.tick,dkey(new Date())));
  $$("[data-dot]").forEach(b=>b.onclick=()=>toggle(b.dataset.dot,b.dataset.day));
  $$("[data-tg]").forEach(b=>b.onclick=()=>{const g=draft[+b.dataset.tg];g.target=Math.max(1,Math.min(7,g.target+ +b.dataset.d));render()});
  $$("[data-gdel]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.gdel,1);render()});
  $$("[data-pre]").forEach(b=>b.onclick=()=>{draft.push({id:uid(),name:b.dataset.pre,target:+b.dataset.t});render()});
  on("#zg-add",()=>{const n=$("#zg-n").value.trim();if(!n)return;draft.push({id:uid(),name:n,target:3});render()});
  on("#zg-save",()=>{const m=mine()?structuredClone(mine()):{log:{},createdAt:Date.now()};m.goals=draft.map(g=>({id:g.id,name:g.name,target:g.target}));save(m);draft=null;tab="today";toast("Ziele gespeichert")});
}
register({id:"ziele",title:"Ziele",icon:"ziele",col,view,bind,summary});
})();

/* ================= Startseite + Start der App ================= */
(()=>{
function view(){
  const h=new Date().getHours(),greet=h<11?"Guete Morge":h<17?"Hoi":"Guete Abig";
  const name=(App.myName||"").split(" ")[0];
  const cards=["budget","film","training","ziele"].map(id=>{const m=App.mods[id],s=m.summary();return `<button class="modcard" data-c="${id}" data-go="${id}">${ico(m.icon)}<div style="min-width:0"><b>${m.title==="Film"?"Filmabend":m.title}</b><span>${esc(s.text)}</span></div><span class="big">${esc(s.big)}</span></button>`}).join("");
  return `<div class="hello"><span class="date">${new Date().toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long"})}</span><h1>${greet}${name?" "+esc(name):""}</h1></div>
  <div class="list" style="gap:10px">${cards}</div>
  ${App.cloud?"":`<div class="alert">Du bist nicht über Claude angemeldet. Die App speichert gerade nur in diesem Browser, und Filmsuche, Coach und Teilen gehen nicht. Öffne die App über deinen Claude-Link.</div>`}`;
}
function bind(){$$("#root [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
register({id:"home",title:"Start",icon:"home",view,bind});

async function boot(){
  const h=location.hash.slice(1);App.cur=App.mods[h]?h:"home";
  render();
  const c=await getClaude();
  if(c){try{[App.db,App.user,App.sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")])}catch(e){}}
  if(App.user){App.me=await App.user.id().catch(()=>null);try{const me=await App.user.me();App.myName=me.name||""}catch(e){}}
  App.cloud=!!(App.db&&App.me);
  Object.values(App.mods).forEach(m=>{if(m.doc)m.doc.start();if(m.col)m.col.start()});
  render();
}
$$(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#fab").onclick=()=>{const m=App.mods[App.cur];if(m.onFab)m.onFab()};
// Startseite zuerst in der Navigation
App.order=["home",...App.order.filter(x=>x!=="home")];
boot();
})();

</script>
